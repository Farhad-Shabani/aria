name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake clang libasound2-dev pkg-config espeak-ng xvfb
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: just@1.58.0,taplo@0.10.0,cargo-shear@1.14.0
      - uses: astral-sh/setup-uv@v10.3.0
      - name: just check
        run: xvfb-run -a just check
