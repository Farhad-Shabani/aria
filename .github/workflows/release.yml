name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  macos:
    name: macOS app
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      app-artifact-id: ${{ steps.app.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0,cargo-about@0.9.2
      # Before anything reaches the release environment's key.
      - name: Check the tag matches the workspace version
        run: |
          version=$(just --evaluate version)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$version"; exit 1; }
      - name: just release-macos
        run: just release-macos
      # The sign job signs the app, not this ad-hoc DMG. tar keeps the modes
      # and symlinks that upload-artifact drops.
      - name: Pack the app
        run: tar -C clients/build/mac/Build/Products/Release -czf "$RUNNER_TEMP/Aria.app.tar.gz" Aria.app
      - id: app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-app
          path: ${{ runner.temp }}/Aria.app.tar.gz
          if-no-files-found: error

  # The signing keys reach only this job, behind the release environment's
  # reviewer. It runs first-party actions and this repository's scripts,
  # never the build's third-party tools.
  macos-sign:
    name: Sign and notarize the macOS app
    needs: macos
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # By id, so the still-running linux job can't swap the app.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.macos.outputs.app-artifact-id }}
          path: ${{ runner.temp }}
      - name: Unpack the app
        run: tar -xzf "$RUNNER_TEMP/Aria.app.tar.gz" -C "$RUNNER_TEMP"
      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          identity=$(scripts/macos/keychain.sh "$RUNNER_TEMP/signing.keychain-db")
          echo "ARIA_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Sign and package
        run: scripts/macos/package.sh "$RUNNER_TEMP/Aria.app" "${GITHUB_REF_NAME#v}"
      - name: Verify the signature
        run: |
          set -euo pipefail
          codesign --verify --deep --strict "$RUNNER_TEMP/Aria.app"
          for code in "$RUNNER_TEMP/Aria.app" "$RUNNER_TEMP/Aria.app/Contents/Helpers/aria"; do
            entitlements=$(codesign -d --entitlements - "$code")
            grep -q com.apple.security.device.audio-input <<< "$entitlements"
          done
      - name: Notarize and staple
        env:
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
        run: scripts/macos/notarize.sh "dist/aria-${GITHUB_REF_NAME#v}-macos-arm64.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/aria-*-macos-arm64.dmg
          if-no-files-found: error

  linux:
    name: Linux binary
    # The oldest Ubuntu LTS with the libstdc++ 13 that ONNX Runtime needs, so
    # the binary runs there and on anything newer.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake clang libasound2-dev libssl-dev pkg-config
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0,cargo-about@0.9.2
      - name: just release-linux
        run: just release-linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/aria-*-linux-x86_64.tar.gz
          if-no-files-found: error

  checksums:
    name: Checksums
    needs: [macos-sign, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0
      # Only what ships: the notarized DMG and the Linux tarball.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{macos,linux}'
          path: dist
          merge-multiple: true
      - name: just release-checksums
        run: just release-checksums
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  # Only first-party actions run beside the write token.
  publish:
    name: Publish
    needs: checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
