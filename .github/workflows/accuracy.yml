name: Accuracy

# Pull requests run the check only when they touch code it measures. Every
# push to main runs it, which catches what the path list misses.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".cargo/**"
      - ".github/workflows/accuracy.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "justfile"
      - "rust-toolchain.toml"
      - "crates/aria-bench/**"
      - "crates/aria-harness/**"
      - "crates/aria-kit/**"
      - "crates/aria-primitives/**"
      - "crates/aria-stt/**"
      - "crates/aria/Cargo.toml"
      - "crates/aria/src/config/**"
      - "crates/aria/src/transcription/**"

permissions:
  contents: read

env:
  # whisper.cpp otherwise compiles for the build machine's CPU, and a cached
  # build restored on a runner with an older CPU dies with SIGILL.
  GGML_NATIVE: "OFF"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accuracy:
    name: Accuracy
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just@1.58.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/aria-test-models
          key: whisper-tiny-en-921e4cf8
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: corpus
        with:
          path: build/corpus/wav
          key: corpus-${{ hashFiles('crates/aria-bench/corpus/librispeech-test-clean.tsv') }}
      - name: Install ffmpeg
        if: steps.corpus.outputs.cache-hit != 'true'
        run: brew install ffmpeg
      - name: Check word error rate against the committed reference
        run: just accuracy-check ~/.cache/aria-test-models
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: accuracy-check
          path: build/accuracy-check
