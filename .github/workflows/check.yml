name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake clang libasound2-dev pkg-config espeak-ng xvfb
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: just@1.58.0,taplo@0.10.0,cargo-shear@1.14.0
      - uses: astral-sh/setup-uv@v10.3.0
      - name: just check
        run: xvfb-run -a just check

  macos:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: just@1.58.0
      - name: Lint and test Rust
        run: just rust-lint-all rust-test-all

  app:
    name: App
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: just@1.58.0
      - name: just swift-check
        run: just swift-check
