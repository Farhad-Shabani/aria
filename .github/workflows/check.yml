name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # whisper.cpp otherwise compiles for the build machine's CPU, and a cached
  # build restored on a runner with an older CPU dies with SIGILL.
  GGML_NATIVE: "OFF"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake clang libasound2-dev pkg-config espeak-ng xvfb
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.58.0,taplo@0.10.0,cargo-shear@1.14.0,cargo-deny@0.20.2
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          version: 1.75.0
          setup_only: true
          pr_comment: false
          push: false
      - name: Check protobuf compatibility
        if: github.event_name == 'pull_request'
        env:
          PROTO_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git cat-file -e "$PROTO_BASE"
          if git cat-file -e "$PROTO_BASE:buf.yaml" 2>/dev/null; then
            just proto-breaking "$PROTO_BASE"
          else
            echo "The base revision has no Buf baseline; format and lint still run."
          fi
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: just check
        run: xvfb-run -a -s '-screen 0 1280x1024x24 -noreset' just check

  features:
    name: Features
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake clang libasound2-dev pkg-config
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.58.0
      - name: just rust-features rust-wasm
        run: just rust-features rust-wasm

  macos:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.58.0
      # The acceptance cases that start a daemon need a transcription model.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/aria-test-models
          key: whisper-tiny-en-921e4cf8
      - name: Fetch the test transcription model
        run: |
          model="$(just test-model ~/.cache/aria-test-models)"
          echo "ARIA_TEST_WHISPER_MODEL=$model" >> "$GITHUB_ENV"
      - name: Lint and test Rust
        run: just rust-lint-all rust-test-all

  app:
    name: App
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen and protoc
        run: brew install xcodegen protobuf
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.58.0
      - name: just swift-check
        run: just swift-check
