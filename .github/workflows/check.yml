name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # whisper.cpp otherwise compiles for the build machine's CPU, and a cached
  # build restored on a runner with an older CPU dies with SIGILL.
  GGML_NATIVE: "OFF"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake clang libasound2-dev pkg-config espeak-ng xvfb
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just@1.58.0,taplo@0.10.0,cargo-shear@1.14.0,cargo-deny@0.20.2
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: 1.75.0
          setup_only: true
          pr_comment: false
          push: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: just check
        run: xvfb-run -a -s '-screen 0 1280x1024x24 -noreset' just check

  features:
    name: Features
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake clang libasound2-dev pkg-config
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just@1.58.0
      - name: just rust-features rust-wasm
        run: just rust-features rust-wasm

  macos:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just@1.58.0
      # The acceptance cases that start a daemon need a transcription model.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/aria-test-models
          key: whisper-tiny-en-921e4cf8
      - name: Fetch the test transcription model
        run: |
          model="$(just test-model ~/.cache/aria-test-models)"
          echo "ARIA_TEST_WHISPER_MODEL=$model" >> "$GITHUB_ENV"
      - name: Lint and test Rust
        run: just rust-lint-all rust-test-all

  app:
    name: App
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen and protoc
        run: brew install xcodegen protobuf
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just@1.58.0
      - name: just swift-check
        run: just swift-check
