[package]
name                 = "aria-stt"
version.workspace    = true
edition.workspace    = true
description          = "Local speech-to-text engines behind aria-kit's transcription contract"
license              = "Apache-2.0"
repository.workspace = true
readme.workspace     = true
keywords             = [ "speech-to-text", "stt", "asr", "whisper", "parakeet" ]

[package.metadata.docs.rs]
features = [ "microphone", "moonshine", "nemotron", "parakeet", "parakeet-gpu", "parakeet-mlx", "whisper", "whisper-candle" ]

[lints]
workspace = true

[features]
default    = [  ]
microphone = [ "aria-kit/microphone" ]
moonshine  = [ "dep:ort", "dep:serde", "dep:serde_json", "dep:tracing" ]
nemotron   = [ "dep:parakeet-rs" ]
parakeet   = [ "dep:parakeet-rs" ]
# macOS only. ONNX Runtime's WebGPU provider links libwebgpu_dawn.dylib, which
# a binary then loads at launch: it must ship beside the executable and be
# found through an rpath such as `@executable_path`.
parakeet-gpu   = [ "parakeet", "parakeet-rs/webgpu" ]
parakeet-mlx   = [ "dep:serde", "dep:serde_json", "dep:tracing" ]
whisper        = [ "dep:whisper-rs" ]
whisper-candle = [ "dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:serde_json", "dep:thiserror", "dep:tokenizers" ]

[dependencies]
aria-kit            = { workspace = true }
candle-core         = { version = "0.11", optional = true }
candle-nn           = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
serde_json          = { workspace = true, optional = true }
thiserror           = { workspace = true, optional = true }
# The default regex engine links C; this engine also builds for browsers.
tokenizers = { version = "0.21", default-features = false, features = [ "unstable_wasm" ], optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ort         = { workspace = true, optional = true }
parakeet-rs = { version = "0.3.7", optional = true }
serde       = { workspace = true, optional = true }
tracing     = { workspace = true, optional = true }
whisper-rs  = { version = "0.16", features = [ "tracing_backend" ], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = [ "metal", "tracing_backend" ], optional = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
anyhow       = { workspace = true }
aria-harness = { workspace = true }
# The doctests open the microphone.
aria-kit = { workspace = true, features = [ "microphone" ] }
tempfile = { workspace = true }

[[bench]]
name              = "parakeet_decode"
harness           = false
required-features = [ "parakeet" ]

[[test]]
name              = "parakeet_mlx_sidecar"
required-features = [ "parakeet-mlx" ]

[[example]]
name              = "transcribe"
required-features = [ "whisper" ]
