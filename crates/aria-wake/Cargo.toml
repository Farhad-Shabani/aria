[package]
name                 = "aria-wake"
version.workspace    = true
edition.workspace    = true
description          = "Wake-word detection with openWakeWord and livekit-wakeword models"
license              = "Apache-2.0"
repository.workspace = true
readme.workspace     = true
keywords             = [ "wake-word", "hotword", "keyword-spotting", "openwakeword", "voice" ]

[lints]
workspace = true

[features]
default      = [  ]
livekit      = [ "dep:ort", "dep:thiserror" ]
openwakeword = [ "dep:ort", "dep:thiserror" ]

[dependencies]
aria-kit = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ort       = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
aria-kit = { workspace = true, features = [ "test-support" ] }
tempfile = { workspace = true }
hound    = { workspace = true }

[[test]]
name              = "livekit_detection"
required-features = [ "livekit" ]

[[test]]
name              = "openwakeword_detection"
required-features = [ "openwakeword" ]
