[package]
name                 = "aria-web"
version.workspace    = true
edition.workspace    = true
description          = "Aria's dictation pipeline compiled to WebAssembly for the browser"
license              = "Apache-2.0"
repository.workspace = true
readme.workspace     = true
keywords             = [ "wasm", "webassembly", "speech-to-text", "browser", "dictation" ]

[package.metadata.docs.rs]
targets = [ "wasm32-unknown-unknown" ]

[lib]
crate-type = [ "cdylib", "rlib" ]

[lints]
workspace = true

[package.metadata.cargo-shear]
ignored = [ "getrandom" ]

[dependencies]
aria-kit     = { workspace = true }
aria-stt     = { workspace = true, features = [ "whisper-candle" ] }
thiserror    = { workspace = true }
wasm-bindgen = "0.2"

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { workspace = true, features = [ "wasm_js" ] }
