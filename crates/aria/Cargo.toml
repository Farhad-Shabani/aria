[package]
name                 = "aria"
version.workspace    = true
edition.workspace    = true
description          = "Local, privacy-first voice assistant: the daemon and CLI"
license              = "GPL-3.0-only"
repository.workspace = true
readme.workspace     = true
publish              = false

[lints]
workspace = true

[dependencies]
anyhow            = { workspace = true }
aria-settings     = { workspace = true }
aria-assistant    = { workspace = true }
aria-daemon       = { workspace = true }
aria-kit          = { workspace = true, features = [ "microphone", "playback" ] }
aria-platform     = { workspace = true }
aria-primitives   = { workspace = true }
aria-stt          = { workspace = true, features = [ "moonshine", "nemotron", "parakeet", "whisper", "whisper-candle" ] }
aria-tts          = { workspace = true, features = [ "kokoro", "qwen", "system" ] }
aria-voice        = { workspace = true }
aria-wake         = { workspace = true, features = [ "livekit", "openwakeword" ] }
aria-segmentation = { workspace = true }
aria-speaker      = { workspace = true }
clap              = { workspace = true }
prost             = "0.14"

rustix             = { workspace = true, features = [ "fs", "process", "system", "termios" ] }
serde_json         = { workspace = true }
sha2               = { workspace = true }
signal-hook        = { version = "0.4", default-features = false }
tempfile           = { workspace = true }
thiserror          = { workspace = true }
time               = { workspace = true }
toml_edit          = { workspace = true, features = [ "display", "parse", "serde" ] }
tonic              = { version = "0.14", features = [ "tls-ring" ] }
tracing            = { workspace = true }
tracing-log        = "0.2"
tracing-subscriber = { workspace = true }

# The MLX sidecar requires child processes, which iOS forbids.
[target.'cfg(not(target_os = "ios"))'.dependencies]
aria-stt = { workspace = true, features = [ "parakeet-mlx" ] }

[target.'cfg(target_os = "macos")'.dependencies]
aria-stt = { workspace = true, features = [ "parakeet-gpu" ] }
aria-tts = { workspace = true, features = [ "qwen-accelerate" ] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2            = { workspace = true }
objc2-app-kit    = { version = "0.3.2", default-features = false, features = [ "NSRunningApplication", "libc", "std" ] }
objc2-foundation = { workspace = true, features = [ "NSString", "std" ] }
cidre            = { workspace = true, features = [ "ax", "core_audio", "dispatch", "macos_14_2" ] }

[dev-dependencies]
aria-daemon   = { workspace = true, features = [ "test-support" ] }
aria-voice    = { workspace = true, features = [ "test-support" ] }
aria-settings = { workspace = true, features = [ "test-support" ] }
aria-kit      = { workspace = true, features = [ "test-support" ] }
aria-harness  = { workspace = true }
tokio         = { workspace = true, features = [ "io-util", "macros", "net", "rt-multi-thread", "sync", "time" ] }
serde         = { workspace = true }

# Each catalog case is its own test, so the catalog brings its own runner.
[[test]]
name    = "acceptance"
harness = false

[[bench]]
name    = "dictation_latency"
harness = false

[[bench]]
name    = "first_text"
harness = false

[build-dependencies]
prost             = "0.14"
protox            = "0.9"
tonic-prost-build = "0.14"
