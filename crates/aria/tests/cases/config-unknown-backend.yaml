name: an unsupported transcription backend fails daemon startup
config: |
  transcription:
    backend: vosk
    model: ~/model.bin
expect:
  daemon:
    startup: failure
    stderr_contains:
      - 'transcription.backend does not accept "vosk"; supported values are whisper, whisper-candle, parakeet, moonshine, nemotron, and parakeet-mlx'
