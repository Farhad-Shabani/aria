name: removing a voice nobody enrolled fails
config: |
  transcription:
    backend: whisper
    model: ${WHISPER_MODEL}
  capture:
    backend: wav-file
    path: ${FIXTURES}/silence.wav
expect:
  daemon:
    startup: success
  client:
    - run: [speaker, list]
      stdout_contains:
        - "nobody is enrolled"
    - run: [speaker, remove, ghost]
      exit: failure
      stderr_contains:
        - "that name is not enrolled"
