name: qwen without its talker weights leaves the daemon serving and fails each utterance
settings: |
  [stt]
  backend = "whisper"
  model = "${WHISPER_MODEL}"

  [capture]
  backend = "wav_file"
  path = "${FIXTURES}/silence.wav"

  [tts]
  backend = "qwen"

  [tts.qwen]
  model = "~/missing/qwen-tts"
expect:
  daemon:
    startup: success
    log_contains:
      - "speech is unavailable until an utterance can load it"
  client:
    - run: [say, hello]
      exit: failure
      stderr_contains:
        - 'the qwen model cannot be used'
    - run: [say, --stop]
      stdout_contains:
        - "nothing was playing"
    # Silence ends a dictation at transcription, so nothing reaches the
    # clipboard. Copy mode needs no Accessibility grant.
    - run: [dictate, --mode, copy]
      exit: failure
      stderr_contains:
        - "no speech was detected"
