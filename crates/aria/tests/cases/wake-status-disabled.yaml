name: wake status on a daemon without a wake word says it is disabled
settings: |
  [stt]
  backend = "whisper"
  model = "${WHISPER_MODEL}"

  [capture]
  backend = "wav_file"
  path = "${FIXTURES}/silence.wav"
expect:
  daemon:
    startup: success
  client:
    - run: [wake, status]
      exit: failure
      stdout_contains:
        - "disabled: daemon is running without wake-word monitoring"
