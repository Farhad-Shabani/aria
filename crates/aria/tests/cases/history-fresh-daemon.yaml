name: a fresh daemon has no history, clears it with --yes, and turns on audio retention
config: |
  transcription:
    backend: whisper
    model: ${WHISPER_MODEL}
  capture:
    backend: wav-file
    path: ${FIXTURES}/silence.wav
expect:
  daemon:
    startup: success
  client:
    - run: [history, list]
      stdout_contains:
        - "no dictation history"
    - run: [history, clear, --yes]
      stdout_contains:
        - "Dictation history cleared (0 entries)."
    - run: [history, retain-audio, "true"]
      stdout_contains:
        - "history audio retention: on"
