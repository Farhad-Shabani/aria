name: a fresh daemon has no history, clears it with --yes, and turns on audio retention live
settings: |
  [stt]
  backend = "whisper"
  model = "${WHISPER_MODEL}"

  [capture]
  backend = "wav_file"
  path = "${FIXTURES}/silence.wav"
expect:
  daemon:
    startup: success
  client:
    - run: [history, list]
      stdout_contains:
        - "no dictation history"
    - run: [history, clear, --yes]
      stdout_contains:
        - "Dictation history cleared (0 entries)."
    - run: [settings, set, history.keep_audio, "on"]
      stdout_contains:
        - "applied"
