name: an idle daemon reports nothing transcribing, playing, or in its vocabulary
settings: |
  [stt]
  backend = "whisper"
  model = "${WHISPER_MODEL}"

  [capture]
  backend = "wav_file"
  path = "${FIXTURES}/silence.wav"
expect:
  daemon:
    startup: success
  client:
    - run: [transcribe, status]
      stdout_contains:
        - "not transcribing"
    - run: [vocabulary, status]
      stdout_contains:
        - "Disabled: 0 terms"
    - run: [say, --stop]
      stdout_contains:
        - "nothing was playing"
