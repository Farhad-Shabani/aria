name: kokoro without its model fails daemon startup
settings: |
  [tts]
  backend = "kokoro"

  [tts.kokoro]
  model = "~/missing/kokoro.onnx"
  voices = "~/missing/voices.bin"
expect:
  daemon:
    startup: failure
    stderr_contains:
      - 'failed to initialize speech'
      - 'the kokoro model cannot be used'
