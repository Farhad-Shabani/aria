[package]
name                 = "aria-bench"
version.workspace    = true
edition.workspace    = true
description          = "Accuracy and latency benchmarks for Aria's speech engines"
license              = "GPL-3.0-only"
repository.workspace = true
readme.workspace     = true
publish              = false

[lints]
workspace = true

[dependencies]
aria         = { path = "../aria" }
aria-harness = { workspace = true }
aria-kit     = { workspace = true, features = [ "silero" ] }
aria-speaker = { workspace = true }
aria-stt     = { workspace = true, features = [ "moonshine", "nemotron", "parakeet", "parakeet-mlx", "whisper", "whisper-candle" ] }
aria-tts     = { workspace = true, features = [ "kokoro", "qwen" ] }

anyhow             = { workspace = true }
clap               = { workspace = true }
ort                = { workspace = true }
rustix             = { workspace = true, features = [ "fs" ] }
serde              = { workspace = true }
serde_json         = { workspace = true }
tempfile           = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { version = "0.3", features = [ "env-filter" ] }

# Scoring dependencies stay separate from the daemon's runtime dependencies.
regex                 = "1"
unicode-normalization = "0.1"
unicode-properties    = { version = "0.1", features = [ "general-category" ] }

# Match the app's Qwen acceleration on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
aria-tts = { workspace = true, features = [ "qwen-accelerate" ] }

[build-dependencies]
toml_edit = { version = "=0.25.13", default-features = false, features = [ "parse" ] }

[dev-dependencies]
aria-kit  = { workspace = true, features = [ "test-support" ] }
hound     = { workspace = true }
toml_edit = { version = "=0.25.13", default-features = false, features = [ "parse" ] }
