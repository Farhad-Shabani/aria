[package]
name                 = "aria-assistant"
version.workspace    = true
edition.workspace    = true
description          = "Aria's assistant features: chat with coding assistants and what they remember"
license              = "GPL-3.0-only"
repository.workspace = true
readme.workspace     = true
publish              = false

[lints]
workspace = true

[features]
test-support = [ "aria-kit/test-support" ]

[dependencies]
aria-kit        = { workspace = true }
aria-platform   = { workspace = true }
aria-primitives = { workspace = true }
aria-settings   = { workspace = true }
rusqlite        = { version = "0.40", features = [ "bundled", "hooks" ] }
rustix          = { workspace = true, features = [ "fs", "process", "system", "termios" ] }
serde           = { workspace = true }
serde_json      = { workspace = true }
tempfile        = { workspace = true }
thiserror       = { workspace = true }
tracing         = { workspace = true }

[dev-dependencies]
anyhow        = { workspace = true }
aria-harness  = { workspace = true }
aria-settings = { workspace = true, features = [ "test-support" ] }
