[package]
name                 = "aria-daemon"
version.workspace    = true
edition.workspace    = true
description          = "Aria's running service: composition, actors, the gRPC server and client, the phone relay, and remote inference"
license              = "GPL-3.0-only"
repository.workspace = true
readme.workspace     = true
publish              = false

[lints]
workspace = true

[features]
test-support = [  ]

[dependencies]
aria-settings     = { workspace = true }
aria-assistant    = { workspace = true }
aria-kit          = { workspace = true, features = [ "microphone", "playback" ] }
aria-platform     = { workspace = true }
aria-primitives   = { workspace = true }
aria-stt          = { workspace = true, features = [ "moonshine", "nemotron", "parakeet", "whisper", "whisper-candle" ] }
aria-voice        = { workspace = true }
aria-wake         = { workspace = true, features = [ "livekit", "openwakeword" ] }
aria-segmentation = { workspace = true }
aria-speaker      = { workspace = true }
futures-util      = { version = "0.3", default-features = false, features = [ "alloc" ] }
getrandom         = "0.3"
prost             = "0.14"
prost-types       = "0.14"
rcgen             = "0.14"
rusqlite          = { workspace = true }

rustix             = { workspace = true, features = [ "fs", "process", "system", "termios" ] }
rustls-pki-types   = "1"
serde              = { workspace = true }
serde_json         = { workspace = true }
sha2               = { workspace = true }
signal-hook        = { version = "0.4", default-features = false }
subtle             = "2"
tempfile           = { workspace = true }
thiserror          = { workspace = true }
time               = { workspace = true }
tokio              = { workspace = true, features = [ "io-util", "macros", "net", "rt-multi-thread", "sync", "time" ] }
tokio-rustls       = { version = "0.26", default-features = false, features = [ "logging", "ring" ] }
tokio-stream       = { version = "0.1", features = [ "net" ] }
tokio-util         = { version = "0.7", features = [ "rt" ] }
toml_edit          = { workspace = true, features = [ "display", "parse", "serde" ] }
tonic              = { version = "0.14", features = [ "tls-ring" ] }
tower              = { version = "0.5", default-features = false }
tonic-health       = "0.14"
tonic-prost        = "0.14"
tonic-reflection   = "0.14"
tonic-types        = "0.14"
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# The MLX sidecar requires child processes, which iOS forbids.
[target.'cfg(not(target_os = "ios"))'.dependencies]
aria-stt = { workspace = true, features = [ "parakeet-mlx" ] }

[dev-dependencies]
aria-kit = { workspace = true, features = [ "test-support" ] }
aria-settings  = { workspace = true, features = [ "test-support" ] }
aria-voice     = { workspace = true, features = [ "test-support" ] }
# The relay's timeouts are minutes long; its tests advance the clock instead.
tokio = { workspace = true, features = [ "test-util" ] }

[build-dependencies]
prost             = "0.14"
protox            = "0.9"
tonic-prost-build = "0.14"
