[package]
name                 = "aria-tts"
version.workspace    = true
edition.workspace    = true
description          = "Local text-to-speech engines behind aria-kit's synthesis contract"
license              = "Apache-2.0"
repository.workspace = true
readme.workspace     = true
keywords             = [ "text-to-speech", "tts", "speech-synthesis", "kokoro" ]

[package.metadata.docs.rs]
# The Apple-only qwen-accelerate and qwen-metal stay out: docs.rs builds on Linux.
features = [ "kokoro", "qwen", "system" ]

[lints]
workspace = true

[features]
default = [  ]
kokoro  = [ "dep:misaki-rs", "dep:npyz", "dep:ort", "dep:thiserror", "dep:zip" ]
qwen    = [ "dep:candle-core", "dep:candle-nn", "dep:rand", "dep:serde", "dep:serde_json", "dep:thiserror", "dep:tokenizers" ]
system  = [ "dep:thiserror" ]
# Apple-only Candle backends; Linux selects the qwen CPU feature.
# Accelerate is the released macOS path. Metal initialization can panic in Candle 0.11.
qwen-accelerate = [ "qwen", "candle-core/accelerate", "candle-nn/accelerate" ]
qwen-metal      = [ "qwen", "candle-core/metal", "candle-nn/metal" ]

[dependencies]
aria-kit = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
candle-core = { version = "0.11", optional = true }
candle-nn   = { version = "0.11", optional = true }
misaki-rs   = { version = "0.3", default-features = false, optional = true }
npyz        = { version = "0.9", optional = true }
ort         = { workspace = true, optional = true }
rand        = { version = "0.9", optional = true }
serde       = { workspace = true, optional = true }
serde_json  = { workspace = true, optional = true }
thiserror   = { workspace = true, optional = true }
tokenizers  = { version = "0.23", default-features = false, features = [ "unstable_wasm" ], optional = true }
zip         = { version = "8", default-features = false, optional = true }

# The kokoro doctest speaks through the default output device.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
aria-kit = { workspace = true, features = [ "playback" ] }

[[test]]
name              = "qwen_parity"
required-features = [ "qwen" ]

[[example]]
name              = "qwen_generate_wav"
required-features = [ "qwen" ]

[[example]]
name              = "qwen_clone_wav"
required-features = [ "qwen" ]

[[example]]
name              = "qwen_clone_prefill"
required-features = [ "qwen" ]

[[example]]
name              = "qwen_speaker_check"
required-features = [ "qwen" ]
