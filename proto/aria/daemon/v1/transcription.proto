syntax = "proto3";

package aria.daemon.v1;

import "aria/daemon/v1/errors.proto";
import "aria/daemon/v1/history.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

service SystemTranscriptionService {
  // Capture the machine's own audio output and transcribe it to a file
  // until Stop. Served only by a persistent daemon; an on-demand daemon
  // refuses with UNSUPPORTED. A Start while one runs answers the running
  // system transcription with `already_running`.
  rpc Start(StartSystemTranscriptionRequest) returns (StartSystemTranscriptionResponse);
  rpc Stop(StopSystemTranscriptionRequest) returns (StopSystemTranscriptionResponse);
  rpc GetStatus(GetSystemTranscriptionStatusRequest) returns (GetSystemTranscriptionStatusResponse);
  // The unsaved transcripts, oldest first, but the running session's.
  // A session run with history off or full leaves one, and so does one a
  // crash cut short. They wait in `~/.aria/unsaved`, which never moves.
  rpc ListUnsaved(ListUnsavedTranscriptsRequest) returns (ListUnsavedTranscriptsResponse);
  // An unsaved transcript's text: all of it, or its first 1 MiB.
  // ReadUnsaved and DiscardUnsaved name a transcript by the name
  // ListUnsaved gave. ReadUnsaved of one that's gone fails with
  // HISTORY_MISSING.
  rpc ReadUnsaved(ReadUnsavedTranscriptRequest) returns (ReadUnsavedTranscriptResponse);
  // Delete an unsaved transcript. One already gone counts as deleted.
  // Refused with HISTORY_UNAVAILABLE while history can't open, since only
  // history knows the files it names.
  rpc DiscardUnsaved(DiscardUnsavedTranscriptRequest) returns (DiscardUnsavedTranscriptResponse);
}

message StartSystemTranscriptionRequest {
  // Absolute file path for the transcript, outside `~/.aria/transcripts`
  // and `~/.aria/unsaved`. Absent: a timestamped file in
  // `~/.aria/transcripts`, or in `~/.aria/unsaved` when history won't save
  // it.
  optional string transcript_path = 1;
}

message StartSystemTranscriptionResponse {
  bool already_running = 1;
  string transcript_path = 2;
  TranscriptSaving saving = 3;
}

// What keeps a session's transcript once it ends.
enum TranscriptSaving {
  TRANSCRIPT_SAVING_UNSPECIFIED = 0;
  // `~/.aria/transcripts`, with a history entry from the start.
  TRANSCRIPT_SAVING_HISTORY = 1;
  // Unsaved, because history is off.
  TRANSCRIPT_SAVING_HISTORY_OFF = 2;
  // Unsaved, because Mac Audio history is full.
  TRANSCRIPT_SAVING_HISTORY_FULL = 3;
  // The file the caller named. History never names it.
  TRANSCRIPT_SAVING_OUTPUT = 4;
}

message ListUnsavedTranscriptsRequest {}

message ListUnsavedTranscriptsResponse {
  repeated UnsavedTranscript transcripts = 1;
  // Whether Mac Audio history is full, which is why a session with history
  // on runs unsaved. False while history can't be read.
  bool history_full = 5;
  // Aria's two folders. A copy saved in either, or below it, isn't the
  // person's own, since Aria removes files there.
  string transcripts_dir = 3;
  string unsaved_dir = 4;
}

message UnsavedTranscript {
  // The file's name, which ReadUnsaved and DiscardUnsaved take.
  string name = 1;
  // Absolute, in `~/.aria/unsaved`. The file is plain text, private to its
  // owner.
  string path = 2;
  google.protobuf.Timestamp started_at = 3;
  // How long the session wrote to it.
  google.protobuf.Duration duration = 4;
}

message ReadUnsavedTranscriptRequest {
  string name = 1;
}

message ReadUnsavedTranscriptResponse {
  string text = 1;
  // WHOLE or TRUNCATED.
  HistoryTranscriptRead read = 2;
}

message DiscardUnsavedTranscriptRequest {
  string name = 1;
}

message DiscardUnsavedTranscriptResponse {}

message StopSystemTranscriptionRequest {}

message StopSystemTranscriptionResponse {
  bool was_running = 1;
  string transcript_path = 2;
}

message GetSystemTranscriptionStatusRequest {}

message GetSystemTranscriptionStatusResponse {
  bool running = 1;
  string transcript_path = 2;
  // How the last system transcription ended, when it failed after Start returned — a
  // denied recording permission surfaces here. Empty otherwise.
  string error_message = 3;
}

message SystemTranscriptionEvent {
  SystemTranscriptionStage stage = 1;
  // The segment just transcribed; only for SEGMENT_TRANSCRIBED.
  string text = 2;
  // The tentative live speaker label; empty when unknown.
  string speaker_label = 3;
  // Meaningful only when stage is SYSTEM_TRANSCRIPTION_STAGE_FAILED.
  ErrorCode error_code = 4;
  // How far into the recording, in whole seconds, so a follower's clock
  // matches the transcript file's however late it attached. Only for
  // SEGMENT_TRANSCRIBED.
  google.protobuf.Duration offset = 5;
  // For SPEAKER_MERGED: `merged_from_label` becomes `speaker_label` in the
  // transcript file and subsequent events.
  string merged_from_label = 6;
  // The file the session writes; only for STARTED.
  string transcript_path = 7;
}

// How loud the Mac's audio is while a system transcription runs, about 20
// times a second. A full subscriber queue drops the level without closing
// the subscription.
message SystemAudioLevel {
  // 0 at the noise floor, 1 at loud audio.
  float level = 1;
}

enum SystemTranscriptionStage {
  SYSTEM_TRANSCRIPTION_STAGE_UNSPECIFIED = 0;
  SYSTEM_TRANSCRIPTION_STAGE_SEGMENT_TRANSCRIBED = 1;
  SYSTEM_TRANSCRIPTION_STAGE_STOPPED = 2;
  SYSTEM_TRANSCRIPTION_STAGE_FAILED = 3;
  SYSTEM_TRANSCRIPTION_STAGE_SPEAKER_MERGED = 4;
  // The system transcription was accepted. Capture may still fail to start, which FAILED
  // reports. A subscriber that connects later misses this stage and reads
  // GetStatus instead.
  SYSTEM_TRANSCRIPTION_STAGE_STARTED = 5;
}
