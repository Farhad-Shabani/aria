syntax = "proto3";

package aria.daemon.v1;

import "aria/daemon/v1/chat.proto";
import "aria/daemon/v1/dictation.proto";

service PreferencesService {
  rpc Get(GetPreferencesRequest) returns (PreferenceSnapshot);
  // Optimistic concurrency: a stale `expected_revision` answers `conflict`
  // with the current snapshot rather than overwriting.
  rpc Update(UpdatePreferencesRequest) returns (UpdatePreferencesResponse);
}

message GetPreferencesRequest {}

message UpdatePreferencesRequest {
  // The revision the client last saw.
  uint64 expected_revision = 1;
  PreferencePatch patch = 2;
}

message UpdatePreferencesResponse {
  oneof result {
    PreferenceSnapshot snapshot = 1;
    PreferenceConflict conflict = 2;
  }
}

message PreferenceSnapshot {
  uint64 revision = 1;
  UserPreferences preferences = 2;
}

message PreferenceConflict {
  PreferenceSnapshot current = 1;
}

message AssistantModelPreference {
  AssistantID assistant_id = 1;
  string model_id = 2;
}

message UserPreferences {
  // Recording

  // Whole milliseconds, 100 to 10000 inclusive.
  uint64 silence_duration_ms = 1;
  bool mute_output = 2;

  // Recognition

  // A language code such as "en" or "en-us", or "auto" to detect.
  string recognition_language = 3;
  bool own_voice_only = 4;
  bool project_vocabulary = 5;
  optional string vocabulary_directory = 6;

  // Assistant

  optional AssistantID assistant_id = 7;
  // Each assistant ID appears at most once.
  repeated AssistantModelPreference assistant_models = 8;

  // Delivery

  OutputMode output_mode = 9;
  DeliveryMode delivery_mode = 10;

  // Shortcuts

  HotkeyKey dictation_hotkey = 11;
  // Press to record, again to send, again to cancel.
  Hotkey ask_hotkey = 12;
  // Lists the prompts that are on, so one runs without its own chord.
  Hotkey prompt_list_hotkey = 13;

  // Prompts

  Prompts prompts = 14;

  // App overrides

  ApplicationOverrides application_overrides = 15;

  // History

  bool dictation_history = 16;
  bool history_audio_retention = 17;
}

// Absent fields are unchanged. Explicit UNSPECIFIED mode values are invalid.
// Numbered as `UserPreferences`.
message PreferencePatch {
  // Recording

  // Whole milliseconds, 100 to 10000 inclusive.
  optional uint64 silence_duration_ms = 1;
  optional bool mute_output = 2;

  // Recognition

  // A language code such as "en" or "en-us", or "auto" to detect.
  optional string recognition_language = 3;
  // Filter for enrolled owner voices when a speaker model and owner exist.
  optional bool own_voice_only = 4;
  optional bool project_vocabulary = 5;
  // Empty clears the selected directory; absent leaves it unchanged.
  optional string vocabulary_directory = 6;

  // Assistant

  optional AssistantID assistant_id = 7;
  // Only listed assistants change; an empty model_id resets to the default.
  repeated AssistantModelPreference assistant_models = 8;

  // Delivery

  optional OutputMode output_mode = 9;
  optional DeliveryMode delivery_mode = 10;

  // Shortcuts

  optional HotkeyKey dictation_hotkey = 11;
  Hotkey ask_hotkey = 12;
  Hotkey prompt_list_hotkey = 13;

  // Prompts

  // Replaces every entry.
  Prompts prompts = 14;

  // App overrides

  // Replaces every entry.
  ApplicationOverrides application_overrides = 15;

  // History

  optional bool dictation_history = 16;
  optional bool history_audio_retention = 17;
}

// A Markdown file that says what to make of a recording, and the chord
// that runs it the way the ask hotkey runs an ask.
message Prompt {
  // Stable across renames: what RunPrompt names.
  string id = 1;
  string name = 2;
  // UNSPECIFIED is invalid.
  PromptKind kind = 3;
  // An absolute path to the Markdown instructions, read on each run.
  string instructions_path = 4;
  // Off, it runs neither from the prompt list nor from its chord.
  bool enabled = 5;
  // Absent for a prompt run only from the prompt list.
  Chord chord = 6;
}

// What a prompt makes of what was said. Either way the transcript is
// material for the assistant, never instructions to it.
enum PromptKind {
  PROMPT_KIND_UNSPECIFIED = 0;
  // The same words and meaning, cleaned up or restyled.
  PROMPT_KIND_REWRITE = 1;
  // New text made from what was said, such as a reply, a translation, or a
  // summary.
  PROMPT_KIND_COMPOSE = 2;
}

// At most 16 entries, each ID and each chord once.
message Prompts {
  repeated Prompt entries = 1;
}

// Dictation settings that replace the preferences above. Each absent field
// inherits them. The daemon drops a value equal to the preference, and the
// delivery choice of an app set to Copy output, which cannot stream.
message DictationOverrides {
  optional OutputMode output_mode = 1;
  optional DeliveryMode delivery_mode = 2;
}

// Applies while the app has keyboard focus as dictation starts. A request's
// own modes still win.
message ApplicationOverride {
  // A macOS bundle ID: 1 to 255 bytes of letters, digits, '.', '-' and '_'.
  string application_id = 1;
  // Aria starts no recording and delivers nothing while the app is in front.
  // The overrides stay stored for when it is switched back on.
  bool excluded = 2;
  DictationOverrides overrides = 3;
}

// At most 64 entries, each application ID once.
message ApplicationOverrides {
  repeated ApplicationOverride entries = 1;
}

// The bare modifier whose clean tap starts dictation.
enum HotkeyKey {
  HOTKEY_KEY_UNSPECIFIED = 0;
  HOTKEY_KEY_RIGHT_OPTION = 1;
  HOTKEY_KEY_FN = 2;
}

// A key held with at least one modifier. A chord is registered rather than
// watched, so unlike HotkeyKey it needs no Accessibility grant.
message Chord {
  // The platform virtual key code.
  uint32 key_code = 1;
  bool control = 2;
  bool option = 3;
  bool shift = 4;
  bool command = 5;
}

// One of the Mac app's shortcuts. A patch that sets it with no chord
// clears it.
message Hotkey {
  Chord chord = 1;
}
