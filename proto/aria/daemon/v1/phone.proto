syntax = "proto3";

package aria.daemon.v1;

import "aria/daemon/v1/microphone.proto";
import "google/protobuf/duration.proto";

service RelayService {
  // Take one recording from a phone or watch on the LAN, transcribe it
  // through the model this daemon already holds, and deliver the text the
  // way a press would. The client sends a `RelayStart`, then `RelayAudio`
  // chunks, then a `RelayStop` or a half-close.
  // The recorder stays claimed until the session ends, blocking local dictation.
  // Cancelling the RPC requests cancellation of transcription and delivery;
  // it cannot undo text already delivered.
  // Uploads are capped at 4 MiB per message and four concurrent streams per
  // connection. Audio more than a second past 600 seconds (19,232,000 bytes of
  // PCM) is refused as it streams.
  // RelayStart must arrive within 10 seconds. After Start, a 10-second idle
  // gap yields NO_SPEECH if no audio bytes arrived, or OVERALL_TIMEOUT if
  // audio arrived. Uploads must finish within 120 seconds after Start.
  // Failures arrive as a status carrying an RpcError, not as an event:
  //   BUSY - a recording is running
  //   PAYLOAD_TOO_LARGE - an upload limit is exceeded, or the audio is too long
  //   INVALID_REQUEST - an unsupported format, a missing, late or second
  //     RelayStart, no audio, or PCM ending mid-sample
  //   OVERALL_TIMEOUT - an unfinished upload stalls or exceeds 120 seconds
  //   APPLICATION_EXCLUDED - the app in front on the Mac has Aria switched off
  //   SHUTTING_DOWN - the daemon is stopping
  //   CANCELLED - the client's own stream failed
  //   TRANSCRIPTION_FAILED, DELIVERY_FAILED, DELIVERY_TIMEOUT,
  //     DELIVERY_TARGET_CHANGED - as for a press on the Mac
  // Delivery failures do not return the text and can include partial delivery.
  rpc Relay(stream RelayRequest) returns (stream RelayEvent);

  // Announces a remote recording as it starts, before its audio arrives, so
  // the Mac can show it: DICTATION_STAGE_RECORDING, then CAPTURING with a
  // `RemoteRecording`. Claims nothing, so a press on the Mac still starts.
  // One shows at a time: a second replaces the first, which ends without a
  // word. The recording's `Relay` continues it by `recording_id`.
  // `EndRemoteRecording` or 610 seconds end it with DICTATION_STAGE_CANCELLED,
  // and so does a `Relay` that continues it but fails before transcribing.
  // Once a newer recording started, as a press on the Mac, it ends without a
  // word instead, so the newer one's stages keep the pill.
  //   INVALID_REQUEST - the device is unspecified
  rpc StartRemoteRecording(StartRemoteRecordingRequest) returns (StartRemoteRecordingResponse);
  // Ends an announced recording that won't be relayed, as when the device
  // discards it. An id that isn't the one shown changes nothing.
  rpc EndRemoteRecording(EndRemoteRecordingRequest) returns (EndRemoteRecordingResponse);
}

// Pins the certificate the phone presented on this connection, in exchange
// for the pairing code on the Mac's screen. The only LAN call an unpaired
// phone may make: the code is the credential. A code lives 60 seconds and
// works once.
//   UNAUTHENTICATED - the code is wrong, used, or expired
//   PERMISSION_DENIED - the Mac already pairs as many phones as it allows
service PairingService {
  rpc Pair(PairRequest) returns (PairResponse);
}

// What the Mac app does to phone pairing. Served on the unix socket only,
// and only while the relay runs.
service PairingAdminService {
  // Returns the live code while it is unused and unexpired, else a new one.
  rpc IssueInvite(IssueInviteRequest) returns (IssueInviteResponse);
  // Unpins every phone, closes their connections, and ends the live code.
  // The Mac keeps its certificate, so a phone pairs again with a new code.
  //   DURABILITY_UNCONFIRMED - the phones are revoked, but the pairing
  //     file may still pin them, so they can reconnect after a restart
  rpc RevokePhones(RevokePhonesRequest) returns (RevokePhonesResponse);
}

message PairRequest {
  string code = 1;
}

message PairResponse {}

message IssueInviteRequest {}

message IssueInviteResponse {
  // The Mac's display name. The phone identifies the Mac by `fingerprint`.
  string instance_name = 1;
  string code = 2;
  // SHA-256 of the relay certificate's DER bytes; the phone pins it.
  bytes fingerprint = 3;
  // How long the code has left when the Mac sends it.
  google.protobuf.Duration expires_in = 4;
  // Phones paired since the daemon started. If it rises between polls, a
  // phone paired. If it falls, the daemon restarted.
  uint64 pairing_count = 5;
}

message RevokePhonesRequest {}

message RevokePhonesResponse {}

message StartRemoteRecordingRequest {
  RecordingDevice device = 1;
}

message StartRemoteRecordingResponse {
  // The recording's id, as its dictation events carry it.
  uint64 recording_id = 1;
}

message EndRemoteRecordingRequest {
  // As `StartRemoteRecordingResponse` gave it.
  uint64 recording_id = 1;
}

message EndRemoteRecordingResponse {}

message RelayRequest {
  oneof body {
    RelayStart start = 1;
    RelayAudio audio = 2;
    RelayStop stop = 3;
    RelaySubmit submit = 4;
  }
}

// The opening message of a stream. Any other opening message is refused.
message RelayStart {
  AudioFormat format = 1;
  // Press Return once the text is inserted, checked as a `RelaySubmit` is,
  // before COMPLETED. Changes nothing where the app only copies. An app set
  // to insert and press Return does this without it. Ignored unless the Mac
  // lets the phone press Return (`Settings.phone_press_return`).
  bool submit = 2;
  // The announced recording this relay continues, as
  // `StartRemoteRecordingResponse` gave it. Its dictation events then carry
  // this id. Absent, or an id no longer shown: the relay announces itself
  // from `device` once its audio is in.
  optional uint64 recording_id = 3;
  // The phone or watch that recorded. Unspecified for an older client.
  RecordingDevice device = 4;
}

message RelayAudio {
  bytes chunk = 1;
}

// Ends the recording. A half-closed stream ends it too, but only a stop
// leaves the stream open for a `RelaySubmit`.
message RelayStop {}

// Press Return where the text went. Taken once, within 10 seconds of
// COMPLETED, and only when COMPLETED carries a `late_return`. That takes a
// `RelayStop`, the Mac letting the phone press Return
// (`Settings.phone_press_return`), and text typed whole by plain
// insertion. One sent after the stop waits for COMPLETED. Pressed only
// while that field has focus with the caret after the text, or, where the
// field can't be read, while its app is in front. Refused with
// INVALID_REQUEST before the stop, DELIVERY_TARGET_CHANGED once focus
// moved, and BUSY while a recording runs.
message RelaySubmit {}

message RelayEvent {
  RelayStage stage = 1;
  // The text; only on COMPLETED.
  string text = 2;
  // On COMPLETED: Return was pressed after the text, as `RelayStart.submit`
  // or an app set to insert and press Return asks, so no `RelaySubmit` is
  // taken. Terminal. Only while the Mac lets the phone press Return
  // (`Settings.phone_press_return`); otherwise such an app only types,
  // and this stays false.
  bool submitted = 3;
  // On COMPLETED: the Mac takes one `RelaySubmit` for this text, and the
  // stream stays open for it. Absent when it takes none.
  LateReturn late_return = 4;
}

// The Return the Mac offers after a relayed recording's text.
message LateReturn {
  // The app the text went to, as macOS names it, for the phone to show.
  // Absent when the Mac can't name it.
  optional string application_name = 1;
}

enum RelayStage {
  RELAY_STAGE_UNSPECIFIED = 0;
  // The upload is complete; transcribing is starting.
  RELAY_STAGE_TRANSCRIBING = 1;
  // Transcription and delivery succeeded. Terminal, unless it carries a
  // `late_return`: the stream then stays open for a `RelaySubmit`, and the
  // daemon ends it once the offer lapses.
  RELAY_STAGE_COMPLETED = 2;
  // No audio arrived, or no eligible speech was recognized. Terminal.
  RELAY_STAGE_NO_SPEECH = 3;
  // Return was pressed after the text. Terminal.
  RELAY_STAGE_SUBMITTED = 4;
}

enum AudioFormat {
  AUDIO_FORMAT_UNSPECIFIED = 0;
  // Raw mono signed 16-bit little-endian PCM at 16 kHz, without a file header.
  AUDIO_FORMAT_PCM_S16LE = 1;
}

// Served on the LAN to a paired phone, and only while the relay runs.
service PhoneMicrophoneService {
  // The phone offers its microphone for as long as this stream stays open.
  // It sends an offer first, within 10 seconds. The daemon sends Start when
  // a dictation records on the phone, and Stop when it ends. The phone
  // sends audio only after Start, then Stopped once it stops capturing:
  // after Stop, or on its own, such as when its app leaves the front. Both
  // name the recording Start named. Audio between Stop and Stopped is
  // dropped, and a Stopped for an earlier recording is ignored. However it
  // ends, an ended stream also means stop. One phone is attached at a
  // time: a newer offer ends this stream without a status, as does a phone
  // that sends no audio within 600 ms of Start, or one too far behind to
  // take Stop.
  // Failures end the stream with a status carrying an RpcError:
  //   UNSUPPORTED - a press wouldn't record on a phone, now or once that
  //     changes: the Mac's microphone setting is "system_default", or names
  //     a Mac device that is connected
  //   INVALID_REQUEST - no offer first, a second offer, audio before Start,
  //     no Stopped within 2 seconds of Stop, or an empty or odd-length chunk,
  //     or one over 64 KiB
  //   SHUTTING_DOWN - the daemon is stopping
  rpc Attach(stream PhoneMicrophoneRequest) returns (stream PhoneMicrophoneCommand);
}

message PhoneMicrophoneRequest {
  oneof body {
    PhoneMicrophoneOffer offer = 1;
    PhoneMicrophoneAudio audio = 2;
    PhoneMicrophoneStopped stopped = 3;
  }
}

message PhoneMicrophoneOffer {}

message PhoneMicrophoneAudio {
  // Raw mono signed 16-bit little-endian PCM at 16 kHz, without a file
  // header, as `AUDIO_FORMAT_PCM_S16LE` names it.
  bytes chunk = 1;
}

message PhoneMicrophoneStopped {
  // The `recording` of the Start it stopped.
  uint64 recording = 1;
}

message PhoneMicrophoneCommand {
  oneof body {
    PhoneMicrophoneStart start = 1;
    PhoneMicrophoneStop stop = 2;
  }
}

// Open the microphone and send audio.
message PhoneMicrophoneStart {
  // Names this recording. Never repeats on one daemon.
  uint64 recording = 1;
}

// Stop capturing, then send Stopped.
message PhoneMicrophoneStop {
  // The `recording` of the Start to stop.
  uint64 recording = 1;
}
