syntax = "proto3";

package aria.daemon.v1;

import "aria/daemon/v1/dictation.proto";
import "aria/daemon/v1/microphone.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

service RelayService {
  // Take one recording from a phone or watch on the LAN as it is recorded,
  // and run it as a press on the Mac from its first audio. The client opens
  // a stream with a `RelayStart`, sends `RelayAudio` chunks, and ends the
  // recording with a `RelayStop` or a `RelayCancel`. The press types as the Mac's delivery setting says,
  // streaming included, and Escape or a manual press on the Mac stops it. It
  // starts only while nothing records on the Mac.
  // A `RelayCancel` cancels the recording: nothing more of it types, though
  // text already delivered stays. Cancelling the RPC alone is not a cancel:
  // the Mac can't tell it from a lost connection.
  // Messages are capped at 4 MiB and four concurrent streams per connection.
  // Audio more than a second past 600 seconds (19,232,000 bytes of PCM) is
  // refused as it streams.
  // RelayStart must arrive within 10 seconds. After Start, a 10-second idle
  // gap yields NO_SPEECH if no audio bytes arrived. Once audio arrived, the
  // Mac says RECORDING, and a gap in the audio as long as its
  // `quiet_limit_ms` ends the recording with what it has. So does the Mac's recording limit.
  // A stream that fails while the Mac still takes the recording's audio
  // leaves a recording that named itself in `RelayStart.recording_id`
  // waiting. A stream fails when it ends before its stop or breaks as a lost
  // connection does. A malformed message ends the recording instead. A
  // stream from the same phone that opens with a `RelayContinuation`
  // continues it, from the audio CONTINUED says the Mac took. The Mac takes audio until the client's stop, or until it
  // ends the recording itself and says TRANSCRIBING. After that no stream
  // continues the recording. A recording whose client is gone, or that ends
  // while it waits, still types what the Mac heard. It presses no Return,
  // nor does one the Mac ended because its audio stopped arriving.
  // The press runs within the Mac's dictation timeouts.
  // Failures arrive as a status carrying an RpcError, not as an event:
  //   BUSY - a recording is running. This can arrive after the first audio.
  //   PAYLOAD_TOO_LARGE - the audio is too long
  //   UNSUPPORTED - the Mac's capture can't take audio from a device
  //   INVALID_REQUEST - an unsupported format, a missing, late or second
  //     RelayStart, PCM ending mid-sample, a chunk that isn't whole samples,
  //     or a `recording_id` that is empty, over 32 bytes, or in use
  //   APPLICATION_EXCLUDED - the app in front on the Mac has Aria switched off
  //   SHUTTING_DOWN - the daemon is stopping
  //   CANCELLED - the client sent a `RelayCancel`, its own stream failed, or
  //     a `RelayContinuation` named a recording that is over
  //   TRANSCRIPTION_FAILED, DELIVERY_FAILED, DELIVERY_TIMEOUT,
  //     DELIVERY_TARGET_CHANGED - as for a press on the Mac
  // Delivery failures do not return the text and can include partial delivery.
  rpc Relay(stream RelayRequest) returns (stream RelayEvent);
}

// Pins the certificate the phone presented on this connection, in exchange
// for the pairing code on the Mac's screen. The only LAN call an unpaired
// phone may make: the code is the credential. A code lives 60 seconds and
// works once.
//   UNAUTHENTICATED - the code is wrong, used, or expired
//   PERMISSION_DENIED - the Mac already pairs as many phones as it allows
//   INVALID_REQUEST - `hardware_model` is malformed; the code stays unused
service PairingService {
  rpc Pair(PairRequest) returns (PairResponse);
}

// What the Mac app does to phone pairing. Served on the unix socket only,
// and only while the relay runs.
service PairingAdminService {
  // Returns the live code while it is unused and unexpired, else a new one.
  rpc IssueInvite(IssueInviteRequest) returns (IssueInviteResponse);
  // Unpins every phone, closes their connections, and ends the live code.
  // The Mac keeps its certificate, so a phone pairs again with a new code.
  //   DURABILITY_UNCONFIRMED - the phones are revoked, but the pairing
  //     file may still pin them, so they can reconnect after a restart
  rpc RevokePhones(RevokePhonesRequest) returns (RevokePhonesResponse);
  // The phones this Mac pins, in the order they paired.
  rpc ListPhones(ListPhonesRequest) returns (ListPhonesResponse);
  // Unpins one phone and closes its connections, and those of any phone
  // still pairing. Other paired phones and the live code stay. A phone this
  // Mac does not pin changes nothing.
  //   INVALID_REQUEST - the fingerprint is not 32 bytes
  //   DURABILITY_UNCONFIRMED - the phone is revoked, but the pairing file
  //     may still pin it, so it can reconnect after a restart
  rpc RevokePhone(RevokePhoneRequest) returns (RevokePhoneResponse);
}

message PairRequest {
  string code = 1;
  // The phone's model identifier, as `uname` reports it, such as
  // `iPhone18,1`: up to 32 ASCII letters, digits, and commas. Empty when the
  // phone doesn't say.
  string hardware_model = 2;
}

message PairResponse {}

message IssueInviteRequest {}

message IssueInviteResponse {
  // The Mac's display name. The phone identifies the Mac by `fingerprint`.
  string instance_name = 1;
  string code = 2;
  // SHA-256 of the relay certificate's DER bytes; the phone pins it.
  bytes fingerprint = 3;
  // How long the code has left when the Mac sends it.
  google.protobuf.Duration expires_in = 4;
  // Phones paired since the daemon started. If it rises between polls, a
  // phone paired. If it falls, the daemon restarted.
  uint64 pairing_count = 5;
}

message RevokePhonesRequest {}

message RevokePhonesResponse {}

message ListPhonesRequest {}

message ListPhonesResponse {
  repeated PairedPhone phones = 1;
}

message PairedPhone {
  // SHA-256 of the phone's certificate DER bytes, as the Mac pins it.
  bytes fingerprint = 1;
  // As `PairRequest.hardware_model` gave it. Empty when unknown.
  string hardware_model = 2;
  // Absent for a phone that paired before the Mac recorded it.
  google.protobuf.Timestamp pair_time = 3;
}

message RevokePhoneRequest {
  // As `PairedPhone.fingerprint` gives it.
  bytes fingerprint = 1;
}

message RevokePhoneResponse {}

// A stream opens with `start` or `continuation`, and only there. Audio
// follows until `stop` or `cancel` ends the recording. After a `stop`, only
// `submit` and `cancel` are taken.
message RelayRequest {
  oneof body {
    RelayStart start = 1;
    RelayContinuation continuation = 5;
    RelayAudio audio = 2;
    RelayStop stop = 3;
    RelaySubmit submit = 4;
    RelayCancel cancel = 6;
  }
}

// The opening message of a recording's first stream.
message RelayStart {
  AudioFormat format = 1;
  // The phone or watch that records. Unspecified for an older client.
  RecordingDevice device = 4;
  // Names the recording, so a later stream can continue it: 1 to 32 bytes
  // the client picks at random. Absent, no stream continues it.
  optional bytes recording_id = 5;
}

// The opening message of a stream that continues a recording whose stream
// failed. Audio and the stop follow as after a `RelayStart`.
message RelayContinuation {
  // As the recording's `RelayStart.recording_id` gave it.
  bytes recording_id = 1;
}

message RelayAudio {
  bytes chunk = 1;
}

// Ends the recording, and the Mac types what it heard. A stream that ends
// without a stop has failed, as a dropped connection ends it. After the stop
// the stream stays open for a `RelaySubmit` or a `RelayCancel`. A
// half-close after it says the client asks nothing more.
message RelayStop {}

// Press Return where the text went. Taken once, within 10 seconds of
// COMPLETED, and only when COMPLETED carries a `return_offer`. That takes a
// `RelayStop`, the Mac letting the phone press Return
// (`Settings.phone_submits`), and text typed whole by plain
// insertion. One sent after the stop waits for COMPLETED. Pressed only
// while that field has focus with the caret after the text, or, where the
// field can't be read, while its app is in front. Refused with
// INVALID_REQUEST before the stop, DELIVERY_TARGET_CHANGED once focus
// moved, and BUSY while a recording runs.
message RelaySubmit {}

// Cancels the recording: nothing more of it types, and the stream ends with
// CANCELLED. Taken from the opening until COMPLETED, after a stop included.
// During a Return offer it declines the offer. A stream that continues the
// recording can send it right after its `RelayContinuation`.
message RelayCancel {}

message RelayEvent {
  RelayStage stage = 1;
  // The text; only on COMPLETED.
  string text = 2;
  // On COMPLETED: Return was pressed after the text, as an app set to
  // insert and press Return asks, so no `RelaySubmit` is taken. Terminal.
  // Only while the Mac lets the phone press Return
  // (`Settings.phone_submits`); otherwise such an app only types, and this
  // stays false.
  bool submitted = 3;
  // On COMPLETED: the Mac takes one `RelaySubmit` for this text, and the
  // stream stays open for it. Absent when it takes none.
  ReturnOffer return_offer = 4;
  // On COMPLETED: where the text went. NOT_TYPED or IN_HISTORY when the
  // press ended away from its field, which can come after some words typed.
  DeliveryOutcome delivery = 5;
  // On COMPLETED: how many of the text's words went where `delivery` says,
  // its last ones when some typed before.
  uint32 word_count = 6;
  // On CONTINUED: how many bytes of audio the Mac took on the recording's
  // earlier streams. Audio written after them was lost on the way, so the
  // client sends on from there.
  uint64 taken_bytes = 7;
  // On RECORDING and CONTINUED: how long the recording may go without audio
  // arriving, as when its link is lost, before the Mac ends it and types
  // what it heard. With auto-stop on, the same time without speech ends it
  // too.
  uint32 quiet_limit_ms = 8;
}

// The Return the Mac offers after a relayed recording's text.
message ReturnOffer {
  // The app the text went to, as macOS names it, for the phone to show.
  // Absent when the Mac can't name it.
  optional string application_name = 1;
}

enum RelayStage {
  RELAY_STAGE_UNSPECIFIED = 0;
  // The recording ended. The Mac can stop it before the client does, and
  // drops audio sent after this.
  RELAY_STAGE_TRANSCRIBING = 1;
  // Transcription and delivery succeeded. Terminal, unless it carries a
  // `return_offer`: the stream then stays open for a `RelaySubmit`, and the
  // daemon ends it once the offer lapses.
  RELAY_STAGE_COMPLETED = 2;
  // No audio arrived, or no eligible speech was recognized. Terminal.
  RELAY_STAGE_NO_SPEECH = 3;
  // The phone took the Return offer, and Return was pressed. Terminal.
  RELAY_STAGE_OFFER_TAKEN = 4;
  // The stream continues its recording. The first event of a stream that
  // opened with a `RelayContinuation`, carrying `taken_bytes` and
  // `quiet_limit_ms`.
  RELAY_STAGE_CONTINUED = 5;
  // The Mac took the recording's first audio. The first event of a stream
  // that opened with a `RelayStart`, carrying `quiet_limit_ms`.
  RELAY_STAGE_RECORDING = 6;
}

enum AudioFormat {
  AUDIO_FORMAT_UNSPECIFIED = 0;
  // Raw mono signed 16-bit little-endian PCM at 16 kHz, without a file header.
  AUDIO_FORMAT_PCM_S16LE = 1;
}

// Served on the LAN to a paired phone, and only while the relay runs.
service PhoneMicrophoneService {
  // The phone offers its microphone for as long as this stream stays open.
  // It sends an offer first, within 10 seconds. The daemon sends Start when
  // a dictation records on the phone, and Stop when it ends. The phone
  // sends audio only after Start, then Stopped once it stops capturing:
  // after Stop, or on its own, such as when its app leaves the front. Both
  // name the recording Start named. Audio between Stop and Stopped is
  // dropped, and a Stopped for an earlier recording is ignored. However it
  // ends, an ended stream also means stop. One phone is attached at a
  // time: a newer offer ends this stream without a status, as does a phone
  // that sends no audio within 600 ms of Start, or one too far behind to
  // take Stop.
  // Failures end the stream with a status carrying an RpcError:
  //   UNSUPPORTED - a press wouldn't record on a phone, now or once that
  //     changes: the Mac's microphone setting is "system_default", or names
  //     a Mac device that is connected
  //   INVALID_REQUEST - no offer first, a second offer, audio before Start,
  //     no Stopped within 2 seconds of Stop, or an empty or odd-length chunk,
  //     or one over 64 KiB
  //   SHUTTING_DOWN - the daemon is stopping
  rpc Attach(stream PhoneMicrophoneRequest) returns (stream PhoneMicrophoneCommand);
}

message PhoneMicrophoneRequest {
  oneof body {
    PhoneMicrophoneOffer offer = 1;
    PhoneMicrophoneAudio audio = 2;
    PhoneMicrophoneStopped stopped = 3;
  }
}

message PhoneMicrophoneOffer {}

message PhoneMicrophoneAudio {
  // Raw mono signed 16-bit little-endian PCM at 16 kHz, without a file
  // header, as `AUDIO_FORMAT_PCM_S16LE` names it.
  bytes chunk = 1;
}

message PhoneMicrophoneStopped {
  // The `recording` of the Start it stopped.
  uint64 recording = 1;
}

message PhoneMicrophoneCommand {
  oneof body {
    PhoneMicrophoneStart start = 1;
    PhoneMicrophoneStop stop = 2;
  }
}

// Open the microphone and send audio.
message PhoneMicrophoneStart {
  // Names this recording. Never repeats on one daemon.
  uint64 recording = 1;
}

// Stop capturing, then send Stopped.
message PhoneMicrophoneStop {
  // The `recording` of the Start to stop.
  uint64 recording = 1;
}
