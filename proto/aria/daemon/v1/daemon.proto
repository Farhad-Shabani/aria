syntax = "proto3";

// The Aria daemon client protocol, version 1.
//
// Served as gRPC over a unix stream socket in the per-user runtime
// directory. Alongside these services the daemon serves grpc.health.v1
// (readiness) and server reflection (v1 and v1alpha).
//
// Paired phones reach RelayService, PreferencesService, and health on a
// separate LAN TCP port, using TLS and `authorization: Bearer <token>`.
// PairingService.Pair is the one LAN call without the token: it trades a
// one-time code for it. The Unix socket uses filesystem permissions. LAN
// preference writes are restricted to relay settings; other services stay
// local.
package aria.daemon.v1;

import "aria/daemon/v1/errors.proto";
import "aria/daemon/v1/speech.proto";

// ---------- dictation ----------

service DictationService {
  // Record one utterance, transcribe, deliver. Progress arrives as it
  // happens, best-effort; one `result` or `stop_accepted` ends the press,
  // and progress may still trail it. Read to the outcome. A Manual-mode
  // `Start` during a Manual-mode dictation stops it, answered with
  // `stop_accepted`; any other overlap is refused as RESOURCE_EXHAUSTED.
  // Cancel by cancelling the RPC or disconnecting.
  rpc Start(StartDictationRequest) returns (stream StartDictationResponse);
  // End one recording, whatever stop mode started it: the utterance so far
  // is transcribed and delivered, and its open `Start` answers with the
  // result. Answers false when that recording is not the one running, or
  // is already stopping.
  // Unlike a `Start` that doubles as a stop, this never begins one.
  rpc Stop(StopDictationRequest) returns (StopDictationResponse);
}

message StartDictationRequest {
  // Absent mode overrides use stored preferences; explicit UNSPECIFIED is invalid.
  optional OutputMode output_mode = 1;
  optional StopMode stop_mode = 2;
  optional DeliveryMode delivery_mode = 3;
  // Hand the transcript back without delivering it anywhere.
  bool transcript_only = 4;
  // Absent uses the daemon-selected project vocabulary.
  oneof project {
    string project_directory = 5;
    ProjectVocabularyDisabled project_vocabulary_disabled = 6;
  }
}

message ProjectVocabularyDisabled {}

message StartDictationResponse {
  oneof body {
    DictationResult result = 1;
    DictationStopAccepted stop_accepted = 2;
    // Progress, best-effort. Read to `result` or `stop_accepted`.
    DictationEvent progress = 3;
  }
}

message DictationResult {
  string text = 1;
  // The own-voice gate judged the recording as the owner's: a speaker
  // model with an enrolled owner kept every other voice out.
  bool own_voice = 2;
}

message DictationStopAccepted {}

message StopDictationRequest {
  // From the RECORDING event of the press to end. Zero is refused.
  uint64 recording_id = 1;
}

message StopDictationResponse {
  bool was_recording = 1;
}

message DictationEvent {
  DictationStage stage = 1;
  // The segment just transcribed, and only then. A live caption joins
  // these; the press ends at delivered, cancelled, or failed.
  string text = 2;
  // Meaningful only when stage is DICTATION_STAGE_FAILED.
  ErrorCode error_code = 3;
  // Set on DICTATION_STAGE_RECORDING: what `Stop` takes.
  uint64 recording_id = 4;
  // Set on DICTATION_STAGE_DELIVERED. Unspecified for a press that
  // asked only for its transcript.
  DeliveryOutcome outcome = 5;
  // Set on DICTATION_STAGE_DELIVERED: how many words landed.
  uint32 word_count = 6;
}

message CaptionSnapshot {
  uint64 recording_id = 1;
  string committed = 2;
  string provisional = 3;
  bool ended = 4;
}

// How loud the microphone is while a press records. A full subscriber
// queue drops the level without closing the subscription.
message MicLevel {
  uint64 recording_id = 1;
  // 0 at the noise floor, 1 at loud speech.
  float level = 2;
}

enum DictationStage {
  DICTATION_STAGE_UNSPECIFIED = 0;
  DICTATION_STAGE_RECORDING = 1;
  DICTATION_STAGE_TRANSCRIBING = 2;
  DICTATION_STAGE_DELIVERING = 3;
  DICTATION_STAGE_DELIVERED = 4;
  DICTATION_STAGE_CANCELLED = 5;
  DICTATION_STAGE_FAILED = 6;
  // A streamed segment, a different axis from the press.
  DICTATION_STAGE_SEGMENT_TRANSCRIBED = 7;
  DICTATION_STAGE_SEGMENT_DELIVERED = 8;
}

// Where a delivered transcript went.
enum DeliveryOutcome {
  DELIVERY_OUTCOME_UNSPECIFIED = 0;
  DELIVERY_OUTCOME_INSERTED = 1;
  DELIVERY_OUTCOME_COPIED = 2;
}

// ---------- preferences ----------

service PreferencesService {
  rpc Get(GetPreferencesRequest) returns (PreferenceSnapshot);
  // Optimistic concurrency: a stale `expected_revision` answers `conflict`
  // with the current snapshot rather than overwriting.
  rpc Update(UpdatePreferencesRequest) returns (UpdatePreferencesResponse);
}

message GetPreferencesRequest {}

message UpdatePreferencesRequest {
  // The revision the client last saw.
  uint64 expected_revision = 1;
  PreferencePatch patch = 2;
}

message UpdatePreferencesResponse {
  oneof result {
    PreferenceSnapshot snapshot = 1;
    PreferenceConflict conflict = 2;
  }
}

message PreferenceSnapshot {
  uint64 revision = 1;
  UserPreferences preferences = 2;
}

message PreferenceConflict {
  PreferenceSnapshot current = 1;
}

message UserPreferences {
  // A language code such as "en" or "en-us", or "auto" to detect.
  string recognition_language = 1;
  OutputMode output_mode = 2;
  StopMode stop_mode = 3;
  DeliveryMode delivery_mode = 4;
  // Whole milliseconds, 100 to 10000 inclusive.
  uint64 silence_duration_ms = 5;
  bool own_voice_only = 6;
  HotkeyKey dictation_hotkey = 7;
  AskHotkey ask_hotkey = 8;
  bool project_vocabulary = 9;
  optional string vocabulary_directory = 10;
  bool dictation_history = 11;
  bool history_audio_retention = 12;
  bool mute_output = 13;
}

message PreferencePatch {
  // Absent fields are unchanged. Explicit UNSPECIFIED mode values are invalid.
  // A language code such as "en" or "en-us", or "auto" to detect.
  optional string recognition_language = 1;
  optional OutputMode output_mode = 2;
  optional StopMode stop_mode = 3;
  optional DeliveryMode delivery_mode = 4;
  // Whole milliseconds, 100 to 10000 inclusive.
  optional uint64 silence_duration_ms = 5;
  // Filter for enrolled owner voices when a speaker model and owner exist.
  optional bool own_voice_only = 6;
  optional HotkeyKey dictation_hotkey = 7;
  AskHotkey ask_hotkey = 8;
  optional bool project_vocabulary = 9;
  // Empty clears the selected directory; absent leaves it unchanged.
  optional string vocabulary_directory = 10;
  optional bool dictation_history = 11;
  optional bool history_audio_retention = 12;
  optional bool mute_output = 13;
}

enum OutputMode {
  OUTPUT_MODE_UNSPECIFIED = 0;
  OUTPUT_MODE_INSERT = 1;
  OUTPUT_MODE_COPY = 2;
  OUTPUT_MODE_INSERT_OR_COPY = 3;
  OUTPUT_MODE_INSERT_AND_SUBMIT = 4;
}

enum StopMode {
  STOP_MODE_UNSPECIFIED = 0;
  STOP_MODE_ON_SILENCE = 1;
  STOP_MODE_MANUAL = 2;
}

enum DeliveryMode {
  DELIVERY_MODE_UNSPECIFIED = 0;
  DELIVERY_MODE_COMPLETE = 1;
  DELIVERY_MODE_STREAMING = 2;
}

// The bare modifier whose clean tap starts dictation.
enum HotkeyKey {
  HOTKEY_KEY_UNSPECIFIED = 0;
  HOTKEY_KEY_RIGHT_OPTION = 1;
  HOTKEY_KEY_FN = 2;
}

// The chord that runs an ask: press to record, again to send, again to
// cancel. A chord is registered rather than watched, so unlike HotkeyKey
// it needs no Accessibility grant. At least one modifier is required.
message AskHotkey {
  bool enabled = 1;
  // The platform virtual key code.
  uint32 key_code = 2;
  bool control = 3;
  bool option = 4;
  bool shift = 5;
  bool command = 6;
}

// ---------- history ----------

service HistoryService {
  rpc List(ListHistoryRequest) returns (ListHistoryResponse);
  rpc Get(GetHistoryRequest) returns (HistoryEntry);
  // Missing entries succeed. Active regeneration refuses deletion with BUSY.
  // Audio cleanup may remain pending; List reports cleanup warnings.
  rpc Delete(DeleteHistoryRequest) returns (DeleteHistoryResponse);
  // Delete all rows, then remove their audio and orphaned recordings. Any
  // active regeneration refuses the whole operation with BUSY. Later saves
  // survive; preferences and active dictation are unchanged. Do not retry
  // automatically after a timeout or disconnect: the result is uncertain.
  rpc Clear(ClearHistoryRequest) returns (ClearHistoryResponse);
  // Re-transcribe retained audio and replace saved text; never deliver it.
  // Defaults to the original engine and language. Failure preserves saved text.
  rpc Regenerate(RegenerateHistoryRequest) returns (HistoryEntry);
}

message ListHistoryRequest {
  // Literal text search, at most 256 UTF-8 bytes; empty matches all entries.
  string query = 1;
  // Exclusive cursor in descending ID order. Absent starts at the newest.
  optional uint64 before_id = 2;
  // Required range: 1 to 100. Zero is invalid.
  uint32 limit = 3;
}

message ListHistoryResponse {
  // Each entry's `text` is a preview of at most 512 UTF-8 bytes; Get supplies
  // the full text.
  repeated HistoryEntry entries = 1;
  optional uint64 next_before_id = 2;
  optional string warning = 3;
}

message GetHistoryRequest {
  uint64 id = 1;
}

message DeleteHistoryRequest {
  uint64 id = 1;
}

message DeleteHistoryResponse {}

message ClearHistoryRequest {}

message ClearHistoryResponse {
  uint64 deleted_entry_count = 1;
  // Rows are deleted, but some audio remains for background cleanup.
  bool audio_cleanup_pending = 2;
}

message RegenerateHistoryRequest {
  uint64 id = 1;
  optional string engine = 2;
  optional string language = 3;
}

message HistoryEntry {
  uint64 id = 1;
  // Unix epoch milliseconds.
  uint64 created_at_ms = 2;
  HistorySource source = 3;
  HistoryApplication application = 4;
  optional uint64 duration_ms = 5;
  string engine = 6;
  string language = 7;
  string text = 8;
  // Whether transcription finished; List may still return a text preview.
  bool transcription_complete = 9;
  HistoryStatus status = 10;
  RpcError error = 11;
  HistoryAudioAvailability audio = 12;
  // Present exactly when audio is AVAILABLE; Unix epoch milliseconds.
  optional uint64 audio_expires_at_ms = 13;
  bool regenerating = 14;
  bool deletion_pending = 15;
  // Audio is available and neither regeneration nor deletion is pending.
  bool can_regenerate = 16;
  optional string warning = 17;
}

message HistoryApplication {
  string name = 1;
  optional string bundle_id = 2;
}

enum HistorySource {
  HISTORY_SOURCE_UNSPECIFIED = 0;
  HISTORY_SOURCE_LOCAL = 1;
  HISTORY_SOURCE_RELAY = 2;
}

enum HistoryStatus {
  HISTORY_STATUS_UNSPECIFIED = 0;
  HISTORY_STATUS_SUCCESS = 1;
  HISTORY_STATUS_TRANSCRIPTION_FAILED = 2;
  HISTORY_STATUS_DELIVERY_FAILED = 3;
  HISTORY_STATUS_RECOVERED = 4;
}

enum HistoryAudioAvailability {
  HISTORY_AUDIO_AVAILABILITY_UNSPECIFIED = 0;
  HISTORY_AUDIO_AVAILABILITY_UNAVAILABLE = 1;
  HISTORY_AUDIO_AVAILABILITY_AVAILABLE = 2;
  HISTORY_AUDIO_AVAILABILITY_EXPIRED = 3;
}

// ---------- vocabulary ----------

service VocabularyService {
  rpc Refresh(VocabularyRequest) returns (VocabularyStatus);
  rpc GetStatus(VocabularyRequest) returns (VocabularyStatus);
  rpc Forget(VocabularyRequest) returns (VocabularyStatus);
}

message VocabularyRequest {
  // Absent: the selected vocabulary directory.
  optional string directory = 1;
}

message VocabularyStatus {
  VocabularyState state = 1;
  uint64 catalog_revision = 2;
  uint64 runtime_revision = 3;
  uint64 term_count = 4;
  // A safe error category, without paths or source content.
  string error_category = 5;
}

enum VocabularyState {
  VOCABULARY_STATE_UNSPECIFIED = 0;
  VOCABULARY_STATE_READY = 1;
  VOCABULARY_STATE_REFRESHING = 2;
  VOCABULARY_STATE_STALE = 3;
  VOCABULARY_STATE_UNAVAILABLE = 4;
  VOCABULARY_STATE_TOO_LARGE = 5;
  VOCABULARY_STATE_DISABLED = 6;
}

// ---------- chat ----------

service ChatService {
  // Hand one prompt to an agent. Answers with a ticket as soon as the ask
  // is taken; the reply follows as a `ChatEvent` under that ticket. Asks
  // run side by side, except that asks on one conversation (agent and
  // session) take turns. Served only by a persistent daemon; an on-demand
  // daemon refuses with UNSUPPORTED.
  rpc Ask(AskRequest) returns (AskResponse);
  // Stop an ask that is running or still waiting its turn. Its agent is
  // killed and the ask ends as a FAILED event with CANCELLED; the
  // conversation stays resumable.
  rpc Cancel(CancelAskRequest) returns (CancelAskResponse);
  // Where an ask goes, for a client with no working directory of its own.
  // Answers with the focused project, else the configured one.
  rpc Resolve(ResolveAskRequest) returns (ResolveAskResponse);
}

message AskRequest {
  string text = 1;
  // The directory the agent works in.
  string workdir = 2;
  // Forget the running conversation and start another.
  bool new_conversation = 3;
  // Deliver the reply like a transcript instead of only announcing it.
  optional OutputMode output_mode = 4;
  ChatAgent agent = 5;
  // A model name the agent's CLI accepts; empty is the agent's default.
  string model = 6;
  // Names the conversation to continue; empty means the directory's.
  string session = 7;
  // The text came from a recording the own-voice gate judged as the
  // owner's; see DictationResult.own_voice.
  bool own_voice = 8;
}

message AskResponse {
  uint64 ticket = 1;
}

message CancelAskRequest {
  uint64 ticket = 1;
}

message CancelAskResponse {
  // False when the ticket was unknown or already done.
  bool was_pending = 1;
}

message ResolveAskRequest {}

message ResolveAskResponse {
  // Both are what `Ask` wants: it takes no empty workdir and no
  // unspecified agent.
  string workdir = 1;
  ChatAgent agent = 2;
}

message ChatEvent {
  ChatStage stage = 1;
  // On REPLIED, why the reply was not delivered (UNSPECIFIED when it was,
  // or delivery was not asked for). On FAILED, what went wrong.
  ErrorCode error_code = 2;
  uint64 ticket = 3;
  // The reply; only on REPLIED.
  string text = 4;
  // The failure, in words; only on FAILED.
  string error_message = 5;
  // The agent serving this ticket.
  ChatAgent agent = 6;
  // What the agent is doing; only on WORKING.
  ChatStep step = 7;
  // The skill being loaded; only when step is SKILL.
  string skill = 8;
}

enum ChatAgent {
  CHAT_AGENT_UNSPECIFIED = 0;
  CHAT_AGENT_CLAUDE_CODE = 1;
  CHAT_AGENT_CODEX = 2;
}

enum ChatStage {
  CHAT_STAGE_UNSPECIFIED = 0;
  // The agent is at work; `step` says on what. Sent again on each change.
  CHAT_STAGE_WORKING = 1;
  CHAT_STAGE_REPLIED = 2;
  CHAT_STAGE_FAILED = 3;
}

// Each value's word is the one every client shows: "thinking", "reading",
// "searching", "running", `skill: <name>`; a value a client does not know
// shows as "unknown".
enum ChatStep {
  CHAT_STEP_UNSPECIFIED = 0;
  CHAT_STEP_THINKING = 1;
  CHAT_STEP_READING = 2;
  CHAT_STEP_SEARCHING = 3;
  CHAT_STEP_RUNNING = 4;
  CHAT_STEP_SKILL = 5;
}

// ---------- listen ----------

service ListenService {
  // Capture the machine's own audio output and transcribe it to a file
  // until Stop. Served only by a persistent daemon; an on-demand daemon
  // refuses with UNSUPPORTED. A Start while listening answers the running
  // session with `already_listening`.
  rpc Start(StartListenRequest) returns (StartListenResponse);
  rpc Stop(StopListenRequest) returns (StopListenResponse);
  rpc GetStatus(GetListenStatusRequest) returns (GetListenStatusResponse);
}

message StartListenRequest {
  // Absolute file path for the transcript. Absent: a timestamped file in
  // the configured transcripts directory.
  optional string transcript_path = 1;
}

message StartListenResponse {
  bool already_listening = 1;
  string transcript_path = 2;
}

message StopListenRequest {}

message StopListenResponse {
  bool was_listening = 1;
  string transcript_path = 2;
}

message GetListenStatusRequest {}

message GetListenStatusResponse {
  bool listening = 1;
  string transcript_path = 2;
  // How the last session ended, when it failed after Start returned — a
  // denied recording permission surfaces here. Empty otherwise.
  string error_message = 3;
}

message ListenEvent {
  ListenStage stage = 1;
  // The segment just transcribed; only for SEGMENT_TRANSCRIBED.
  string text = 2;
  // The tentative live speaker label; empty when unknown.
  string label = 3;
  // Meaningful only when stage is LISTEN_STAGE_FAILED.
  ErrorCode error_code = 4;
  // Seconds into the recording, so a follower's clock matches the
  // transcript file's however late it attached.
  uint64 offset_seconds = 5;
  // For SPEAKER_MERGED: the voice that turned out to be `label`. Everything
  // named this is now named `label`, in the file and from here on.
  string merged_from = 6;
}

enum ListenStage {
  LISTEN_STAGE_UNSPECIFIED = 0;
  LISTEN_STAGE_SEGMENT_TRANSCRIBED = 1;
  LISTEN_STAGE_STOPPED = 2;
  LISTEN_STAGE_FAILED = 3;
  LISTEN_STAGE_SPEAKER_MERGED = 4;
}

// ---------- speaker ----------

service SpeakerService {
  // Record several utterances and store the voice they agree on. Holds the
  // microphone for the whole call, so a press meanwhile is refused with
  // BUSY. Served only by a persistent daemon; an on-demand daemon refuses
  // with UNSUPPORTED. Progress arrives as SpeakerEvent on the event stream.
  rpc Enroll(EnrollSpeakerRequest) returns (EnrollSpeakerResponse);
  // Every enrolled voice, whatever model measured it.
  rpc List(ListSpeakersRequest) returns (ListSpeakersResponse);
  // Forget one voice. NOT_ENROLLED when there was nobody by that name.
  rpc Remove(RemoveSpeakerRequest) returns (RemoveSpeakerResponse);
}

message EnrollSpeakerRequest {
  // The person's name, which is also their profile's filename.
  string name = 1;
  // Unset takes the role that fits: the first voice on a machine owns it,
  // every voice after is a guest.
  SpeakerRole role = 2;
  // How many utterances to record, 2 to 10.
  uint32 samples = 3;
  // Whether a profile of this name may be replaced.
  bool replace = 4;
}

message EnrollSpeakerResponse {
  SpeakerRole role = 1;
  // How strongly the samples agreed, 0.0 to 1.0.
  float consistency = 2;
}

message ListSpeakersRequest {}

message ListSpeakersResponse {
  repeated EnrolledSpeaker speakers = 1;
}

message EnrolledSpeaker {
  string name = 1;
  SpeakerRole role = 2;
  // Seconds since the Unix epoch.
  uint64 enrolled_at_seconds = 3;
}

message RemoveSpeakerRequest {
  string name = 1;
}

message RemoveSpeakerResponse {}

message SpeakerEvent {
  SpeakerStage stage = 1;
  // Which sample this is, counting from one, and how many were asked for.
  // Both zero outside RECORDING and SAMPLE_TAKEN.
  uint32 index = 2;
  uint32 samples = 3;
  // Meaningful only when stage is SPEAKER_STAGE_FAILED.
  ErrorCode error_code = 4;
}

// Only an owner's voice answers "was that you?"; a guest is recognized by
// name without turning on dictation meant for the machine's owner.
enum SpeakerRole {
  SPEAKER_ROLE_UNSPECIFIED = 0;
  SPEAKER_ROLE_OWNER = 1;
  SPEAKER_ROLE_GUEST = 2;
}

enum SpeakerStage {
  SPEAKER_STAGE_UNSPECIFIED = 0;
  // Audio is actually flowing for this sample. Say something now.
  SPEAKER_STAGE_RECORDING = 1;
  // That sample was heard and measured.
  SPEAKER_STAGE_SAMPLE_TAKEN = 2;
  SPEAKER_STAGE_ENROLLED = 3;
  SPEAKER_STAGE_CANCELLED = 4;
  SPEAKER_STAGE_FAILED = 5;
}

// ---------- events ----------

service EventsService {
  // Live events only, with no replay. Subscribe before starting an operation
  // whose result arrives here. At most 64 subscribers, each with a 16-event
  // queue. A full queue drops microphone levels; other events close the stream.
  rpc Subscribe(SubscribeRequest) returns (stream Event);
}

message SubscribeRequest {}

// An unknown payload decodes as empty: skip it, never end the stream.
message Event {
  oneof payload {
    DictationEvent dictation = 1;
    ChatEvent chat = 2;
    SpeechEvent speech = 3;
    ListenEvent listen = 4;
    SpeakerEvent speaker = 5;
    CaptionSnapshot caption = 6;
    MicLevel level = 7;
  }
}
