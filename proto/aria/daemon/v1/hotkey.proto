syntax = "proto3";

package aria.daemon.v1;

service HotkeyService {
  // Whether the Aria key can be heard, and what stands in the way if not.
  // Only the daemon can tell, since macOS grants permissions per process.
  // Served on the unix socket only.
  rpc GetStatus(GetHotkeyStatusRequest) returns (GetHotkeyStatusResponse);
}

message GetHotkeyStatusRequest {}

message GetHotkeyStatusResponse {
  HotkeyState state = 1;
}

enum HotkeyState {
  // Not known: no listener has reported, one failed, or the daemon runs none.
  HOTKEY_STATE_UNSPECIFIED = 0;
  HOTKEY_STATE_ARMED = 1;
  // macOS: Accessibility is off, or its check failed. Linux: the keyboard
  // can't be read.
  HOTKEY_STATE_AWAITING_PERMISSION = 2;
  // macOS refused the taps while Input Monitoring is off, though
  // Accessibility is on.
  HOTKEY_STATE_AWAITING_LISTEN_ACCESS = 3;
  // macOS refused the taps for a reason no permission explains.
  HOTKEY_STATE_REFUSED = 4;
  // No usable device has the key, or the platform can't watch it.
  HOTKEY_STATE_KEY_UNAVAILABLE = 5;
}
