syntax = "proto3";

package aria.daemon.v1;

// Served on the LAN to a paired phone, and only while the relay runs.
service PhoneMicrophoneService {
  // The phone offers its microphone for as long as this stream stays open.
  // It sends an offer first, within 10 seconds. The daemon sends Start when
  // a dictation records on the phone, and Stop when it ends. The phone
  // sends audio only after Start, then Stopped once it stops capturing:
  // after Stop, or on its own, such as when its app leaves the front. Both
  // name the recording Start named. Audio between Stop and Stopped is
  // dropped, and a Stopped for an earlier recording is ignored. However it
  // ends, an ended stream also means stop. One phone is attached at a
  // time: a newer offer ends this stream without a status, as does a phone
  // that sends no audio within 600 ms of Start.
  // Failures end the stream with a status carrying an RpcError:
  //   UNSUPPORTED - a press wouldn't record on a phone, now or once that
  //     changes: the Mac's microphone setting is "system_default", or names
  //     a Mac device that is connected
  //   INVALID_REQUEST - no offer first, a second offer, audio before Start,
  //     no Stopped within 2 seconds of Stop, or an empty or odd-length chunk,
  //     or one over 64 KiB
  //   SHUTTING_DOWN - the daemon is stopping
  rpc Attach(stream PhoneMicrophoneRequest) returns (stream PhoneMicrophoneCommand);
}

message PhoneMicrophoneRequest {
  oneof body {
    PhoneMicrophoneOffer offer = 1;
    PhoneMicrophoneAudio audio = 2;
    PhoneMicrophoneStopped stopped = 3;
  }
}

message PhoneMicrophoneOffer {}

message PhoneMicrophoneAudio {
  // Raw mono signed 16-bit little-endian PCM at 16 kHz, without a file
  // header, as `AUDIO_FORMAT_PCM_S16LE` names it.
  bytes chunk = 1;
}

message PhoneMicrophoneStopped {
  // The `recording` of the Start it stopped.
  uint64 recording = 1;
}

message PhoneMicrophoneCommand {
  oneof body {
    PhoneMicrophoneStart start = 1;
    PhoneMicrophoneStop stop = 2;
  }
}

// Open the microphone and send audio.
message PhoneMicrophoneStart {
  // Names this recording. Never repeats on one daemon.
  uint64 recording = 1;
}

// Stop capturing, then send Stopped.
message PhoneMicrophoneStop {
  // The `recording` of the Start to stop.
  uint64 recording = 1;
}
