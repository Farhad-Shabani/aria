// Setup as `aria::setup` exposes it: look at what the machine has, then
// put the chosen pieces in place. Aria.app speaks it over the stdio of
// the hidden `aria setup inspect`, `aria setup apply`,
// `aria setup set-transcription-engine` and
// `aria setup set-transcription-runs-on`, one message per length-delimited
// frame. Apply runs the whole of setup; the two setters each change one
// choice alone.
//
// Recording a voice and the test press are not here: they are ordinary
// daemon RPCs (SpeakerService, DictationService, SpeechService), and the
// Accessibility grant shows as the `aria.hotkey` health service.
syntax = "proto3";

package aria.setup.v1;

// What the machine has before anything is asked or changed.
message Inspection {
  string settings_path = 1;
  bool macos = 2;
  // What `aria setup --yes` would answer: a configured value verbatim,
  // even one setup does not know, else the default engine.
  Selections defaults = 3;
  repeated Choice transcription_choices = 4;
  repeated Choice synthesis_choices = 5;
  // In the order setup offers them.
  repeated Model models = 7;
  bool wakeword_installed = 8;
  ServiceStatus service = 9;
  Grant grant = 10;
  // What a run still has to put in place; empty once setup is done.
  repeated Missing missing = 11;
  // Unset when nothing is paired.
  PairedServer server = 12;
  // On the server, the local engine stays configured for the way back.
  RunsOn transcription_runs_on = 13;
}

// Where a model runs: on this machine, or on the paired server.
enum RunsOn {
  RUNS_ON_UNSPECIFIED = 0;
  RUNS_ON_LOCAL = 1;
  // The server `Inspection.server` names.
  RUNS_ON_SERVER = 2;
}

// The server the pairing pins. Transcription on the server reaches only it.
message PairedServer {
  string endpoint = 1;
  // Hex, the form `aria remote revoke` takes on the server.
  string client_fingerprint = 2;
}

message Choice {
  // What settings.toml calls it.
  string id = 1;
  string label = 2;
  Availability availability = 3;
  // The fix for MISSING, or why for UNSUPPORTED; empty when READY.
  string availability_detail = 4;
  // Exactly one per family: the configured one, else the first that runs.
  bool default = 5;
  ModelSource model_source = 6;
  // Set only on transcription choices. True when a
  // `SetTranscriptionEngineRequest` can set this engine without the rest of
  // setup: it runs on this Mac, and setup can download its model or it
  // needs none.
  bool settable = 8;
}

// Where an engine's model comes from.
enum ModelSource {
  MODEL_SOURCE_UNSPECIFIED = 0;
  // Setup downloads it; `Inspection.models` lists its files.
  MODEL_SOURCE_DOWNLOADS = 1;
  // The engine fetches it itself, so setup cannot tell its size.
  MODEL_SOURCE_FETCHED_ON_FIRST_USE = 2;
  MODEL_SOURCE_BUILT_IN = 3;
}

enum Availability {
  AVAILABILITY_UNSPECIFIED = 0;
  AVAILABILITY_READY = 1;
  // Pickable, but setup cannot make it work by itself.
  AVAILABILITY_MISSING = 2;
  // Not pickable on this host.
  AVAILABILITY_UNSUPPORTED = 3;
}

message Model {
  string id = 1;
  string title = 2;
  // The engine ID that wants it; empty for one every install wants.
  string engine_id = 3;
  // What the transfer moves.
  uint64 size_bytes = 4;
  // Whether it is fetched when nobody answers.
  bool download_by_default = 5;
  // The model's whole state, from its files and the settings.
  ModelFiles files = 6;
  // Every feature whose settings load it. Empty when nothing loads it, so it
  // can be removed.
  repeated ModelUse used_by = 8;
  // Display name: its engine's label, else its title.
  string label = 9;
}

// The settings table that loads a model.
enum ModelUse {
  MODEL_USE_UNSPECIFIED = 0;
  MODEL_USE_STT = 1;
  MODEL_USE_SYSTEM_TRANSCRIPTION = 2;
  MODEL_USE_TTS = 3;
  MODEL_USE_SPEAKER = 4;
}

enum ModelFiles {
  MODEL_FILES_UNSPECIFIED = 0;
  MODEL_FILES_COMPLETE = 1;
  // Some of its files, or their unfinished parts; a download resumes
  // from them.
  MODEL_FILES_PARTIAL = 2;
  MODEL_FILES_ABSENT = 3;
  // Settings load this engine's files from elsewhere, so setup fetches
  // nothing, whatever ~/.aria/models holds.
  MODEL_FILES_EXTERNAL = 4;
}

// One thing a run still has to put in place.
message Missing {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_SETTINGS = 1;
    KIND_WAKEWORD = 2;
    KIND_MODEL = 3;
    KIND_SERVICE = 4;
    // Reported only when a serving daemon's hotkey listener has not armed.
    // A stopped daemon reports no grant state.
    KIND_GRANT = 5;
    // Modifier Keys in Keyboard settings turns the Aria key into another key,
    // so the hotkey listener never sees it.
    KIND_KEY_REMAPPED = 7;
  }
  Kind kind = 1;
  // The model ID when kind is KIND_MODEL.
  string model_id = 2;
}

// The three answers, as settings.toml spells them.
message Selections {
  string transcription_engine_id = 1;
  string synthesis_engine_id = 2;
  bool wake = 4;
}

message ApplyRequest {
  Selections selections = 1;
  // Models to fetch, by ID; any other wanted one is skipped.
  repeated string downloads = 2;
}

// Events until the run ends, then exactly one summary.
message ApplyResponse {
  oneof body {
    SetupEvent event = 1;
    Summary summary = 2;
  }
}

message SetupEvent {
  oneof event {
    Step started = 1;
    DownloadProgress download = 2;
  }
}

enum Step {
  STEP_UNSPECIFIED = 0;
  STEP_SETTINGS = 1;
  STEP_WAKEWORD = 2;
  STEP_MODELS = 3;
  STEP_SERVICE = 4;
}

message DownloadProgress {
  string model_id = 1;
  uint64 received_bytes = 2;
  uint64 total_bytes = 3;
}

message Summary {
  SettingsWrite settings = 1;
  // Where the wake-word models went; empty when none ship beside the binary.
  string wakeword_dir = 3;
  repeated ModelOutcome models = 4;
  // The removed Python-era wake agent; empty when there was none.
  string legacy_agent_path = 5;
  ServiceStatus service = 6;
  Grant grant = 7;
  // Whether the model a voice is recorded against is on disk.
  bool voice_model_present = 8;
}

// Sets the speech-to-text engine in place: that engine's own missing models
// first, then the settings that name it. Every other choice stays, and
// nothing restarts.
message SetTranscriptionEngineRequest {
  string engine_id = 1;
}

// Events until the change ends, then exactly one summary. STEP_MODELS starts
// only when it fetches something; STEP_SETTINGS starts the write.
message SetTranscriptionEngineResponse {
  oneof body {
    SetupEvent event = 1;
    SetTranscriptionEngineSummary summary = 2;
  }
}

message SetTranscriptionEngineSummary {
  SettingsWrite settings = 1;
  repeated ModelOutcome models = 2;
}

// Sets where dictation transcribes. Going to the server needs a pairing.
// Coming back first fetches the local engine's missing models. Only
// `stt.runs_on` changes, and nothing restarts.
message SetTranscriptionRunsOnRequest {
  RunsOn runs_on = 1;
}

// Events until the change ends, then exactly one summary. STEP_MODELS starts
// only when it fetches something; STEP_SETTINGS starts the write.
message SetTranscriptionRunsOnResponse {
  oneof body {
    SetupEvent event = 1;
    SetTranscriptionRunsOnSummary summary = 2;
  }
}

message SetTranscriptionRunsOnSummary {
  SettingsWrite settings = 1;
  repeated ModelOutcome models = 2;
}

message ModelOutcome {
  string model_id = 1;
  Outcome outcome = 2;
}

enum SettingsWrite {
  SETTINGS_WRITE_UNSPECIFIED = 0;
  SETTINGS_WRITE_UNCHANGED = 1;
  SETTINGS_WRITE_WRITTEN = 2;
}

enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_DOWNLOADED = 1;
  OUTCOME_PRESENT = 2;
  OUTCOME_SKIPPED = 3;
}

// Whether the daemon's hotkey listener armed, which needs the macOS
// Accessibility grant.
enum Grant {
  GRANT_UNSPECIFIED = 0;
  GRANT_ARMED = 2;
  // The daemon runs but the listener has not armed; the grant is owed.
  GRANT_WAITING = 3;
}

message ServiceStatus {
  string unit_path = 1;
  Job job = 2;
  // Set when job is JOB_RUNNING.
  uint32 job_pid = 3;
  string socket_path = 4;
  DaemonState daemon = 5;
  // Set when the socket owner recorded its pid.
  uint32 daemon_pid = 6;
}

enum Job {
  JOB_UNSPECIFIED = 0;
  JOB_ABSENT = 1;
  JOB_IDLE = 2;
  JOB_RUNNING = 3;
}

enum DaemonState {
  DAEMON_STATE_UNSPECIFIED = 0;
  DAEMON_STATE_READY = 1;
  DAEMON_STATE_STARTING = 2;
  DAEMON_STATE_NOT_RUNNING = 3;
}
