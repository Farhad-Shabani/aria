syntax = "proto3";

// The standard gRPC health-checking protocol from grpc/grpc-proto: its Check
// and Watch methods, without the language options or the later List method.
//
// The daemon serves it through `tonic-health`, which carries its own copy;
// this one exists so other clients can generate code from it. Nothing in
// the Rust build reads it. Do not edit: it is somebody else's contract.
package grpc.health.v1;

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    // Used only by the Watch method.
    SERVICE_UNKNOWN = 3;
  }
  ServingStatus status = 1;
}

service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);

  rpc Watch(HealthCheckRequest) returns (stream HealthCheckResponse);
}
