[graph]
all-features = true

[advisories]
version = 2
ignore = [
  { id = "RUSTSEC-2026-0367", reason = "zip extract() is never called: npyz and candle-core only open archives and read entries" },
  { id = "RUSTSEC-2026-0368", reason = "zip extract() is never called: npyz and candle-core only open archives and read entries" },
  { id = "RUSTSEC-2026-0369", reason = "zip extract() is never called: npyz and candle-core only open archives and read entries" },
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained but pulled in by gemm, pulp, and tokenizers; no fork to switch to" },
]

# Mirrors `licenses/about.toml`, plus the two licenses cargo-about never sees
# because they sit behind build and dev dependencies.
[licenses]
version = 2
private = { ignore = true }
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "WTFPL",
  "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry  = "deny"
unknown-git       = "deny"
required-git-spec = "rev"
allow-git         = [ "https://github.com/bilelmoussaoui/ashpd" ]
